<div *ngIf="showHeader">
	<!-- Banner / Cabeçalho-->
	<header class="bg-white shadow-sm rounded mt-3">

		<div class="row align-items-center p-4 justify-content-center">

		<div id="logoDiv" class="col-lg-3 col-md-3 col-sm-5 d-flex align-items-center justify-content-center ">

			<img src="img/logo.png" class="me-4 logo"
				alt="Logo com M estilizado em azul e laranja. Em seguida M, A, R, Metaúrgica escrito em azul. ">

		</div>

		<div id="metalDiv" class="col-lg-4 d-flex align-items-center justify-content-center">
			<div>

				<h1 class="display-4 fw-bold text-primary mb-0 text-center">
					A Metalúrgica
				</h1>

				<h2 class="display-6 text-success fw-semibold text-center">
					Especialista na sua praia
				</h2>

			</div>

		</div>

			<div id="TSTDiv" class="col-lg-4 text-center">

				<h2 class="fw-light">
					Sistema de Gerenciamento
				</h2>

				<p class="fs-4">
					Segurança do Trabalho
				</p>

			</div>

		</div>

	</header>

	<!-- Menu de navegação -->
	<nav>
		<ul class="nav nav-tabs nav-fill justify-content-center p-3 row">

		<li class="col-lg-2">
			<a class="btn btn-outline-dark d-flex align-items-center justify-content-center" href="#">
				<i class="bi bi-house-door"></i>
				&nbsp;HOME
			</a>
		</li>

		<li class="col-lg-2">
			<a class="btn btn-outline-dark d-flex align-items-center justify-content-center" href="#">
				<i class="bi bi-person-raised-hand"></i>
				&nbsp;Portal do funcionário
			</a>
		</li>

		<li class="col-lg-2 dropdown">
			<a class="btn btn-outline-dark d-flex align-items-center justify-content-center dropdown-toggle" href="#" role="button" data-bs-toggle="dropdown" aria-expanded="false">
				<i class="bi bi-shield-shaded"></i>
				&nbsp;Gerenciar EPIs
			</a>
			<ul class="dropdown-menu">
				<li><a class="dropdown-item" routerLink="/components/digital-sheet-modal">Cadastro de EPIs no Estoque</a></li>
				<li><a class="dropdown-item" routerLink="/components/epi-delivery-modal">Entrega de EPIs</a></li>
				<li><a class="dropdown-item" routerLink="/epi/filtro">Pesquisar EPIs</a></li>
			</ul>
		</li>

		<li class="col-lg-2">
			<a class="btn btn-outline-dark d-flex align-items-center justify-content-center" href="#">
				<i class="bi bi-file-text-fill"></i>
				&nbsp;Gerenciar Treinamentos
			</a>
		</li>

		<li class="col-lg-2">
			<a href="src/app/login/login.html"
				class="btn btn-outline-dark d-flex align-items-center justify-content-center">
				<i class="bi bi-person-fill-x"></i>
				&nbsp;Logout
			</a>
		</li>

		</ul>
	</nav>
</div>
