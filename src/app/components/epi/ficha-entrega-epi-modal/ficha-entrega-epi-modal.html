<div class="modal-backdrop-custom">
  <section class="modal-panel wide" role="dialog" aria-modal="true" aria-label="Ficha digital de EPI">
    <div class="panel-title">
      <div>
        <p class="eyebrow">1.c.4</p>
        <h3>Ficha digital de entrega</h3>
      </div>
      <button class="icon-button" type="button" (click)="closed.emit()">
        <i class="bi bi-x-lg"></i>
      </button>
    </div>

    <div class="ficha-entrega-epi">
      <div class="row g-3">
        <div class="col-md-6">
          <label class="form-label">Funcionario</label>
          <input class="form-control" value="Joao Pedro da Rocha de Alcantara" />
        </div>
        <div class="col-md-3">
          <label class="form-label">Itens</label>
          <input class="form-control" [value]="deliveryItems().length + ' EPIs'" readonly />
        </div>
        <div class="col-md-3">
          <label class="form-label">Data</label>
          <input class="form-control" type="date" value="2026-08-06" />
        </div>
        <div class="col-12">
          <div class="sheet-items">
            <article *ngFor="let item of deliveryItems()">
              <strong>{{ item.epi }}</strong>
              <span>CA {{ item.ca }} - qtd. {{ item.quantity }}</span>
            </article>
          </div>
        </div>
        <div class="col-12">
          <label class="form-label">Termo de responsabilidade</label>
          <textarea class="form-control" rows="4">
Declaro ter recebido os EPIs acima, bem como orientacao sobre uso, conservacao e substituicao.
          </textarea>
        </div>
      </div>

      <div class="signature-box">
        <i class="bi bi-vector-pen"></i>
        <span>Area de assinatura digital</span>
      </div>
    </div>

    <div class="action-row end">
      <button class="btn btn-light" type="button" (click)="closed.emit()">Cancelar</button>
      <button class="btn btn-brand" type="button" (click)="closed.emit()">Salvar ficha</button>
    </div>
  </section>
</div>
