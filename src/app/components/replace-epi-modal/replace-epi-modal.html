<div class="modal-backdrop-custom">
  <section class="modal-panel" role="dialog" aria-modal="true" aria-label="Substituir EPI anterior">
    <div class="panel-title">
      <div>
        <p class="eyebrow">Substituicao</p>
        <h3>Marcar EPI anterior como substituido?</h3>
      </div>
      <button class="icon-button" type="button" (click)="closed.emit()">
        <i class="bi bi-x-lg"></i>
      </button>
    </div>

    <div class="replace-list">
      <label *ngFor="let item of previousEpis">
        <input class="form-check-input" type="checkbox" />
        <span>
          <strong>{{ item.name }}</strong>
          <small>CA {{ item.ca }} - entregue em {{ item.deliveredAt }}</small>
        </span>
      </label>
    </div>

    <div class="action-row end">
      <button class="btn btn-light" type="button" (click)="closed.emit()">Cancelar</button>
      <button class="btn btn-brand" type="button" (click)="closed.emit()">Confirmar</button>
    </div>
  </section>
</div>
