<section class="login-page">
  <div class="login-panel">
    <img src="/logo-mar.svg" alt="MAR Metalurgica" />

    <div class="login-copy">
      <p class="eyebrow">Sistema de gerenciamento</p>
      <h1>Seguranca do Trabalho</h1>
      <p>Acesse com seu usuario ou entre por um perfil de demonstracao.</p>
    </div>

    <form class="login-form">
      <label for="email">Email</label>
      <input id="email" type="email" [(ngModel)]="email" name="email" placeholder="email@mar.com" />

      <label for="senha">Senha</label>
      <input id="senha" type="password" [(ngModel)]="senha" name="senha" placeholder="Senha" />

      <button class="btn btn-brand" type="button" (click)="entrar()">
        <i class="bi bi-box-arrow-in-right"></i>
        Entrar
      </button>
    </form>

    <div class="demo-actions">
      <button class="profile-button primary" type="button" (click)="entrarComoTecnico()">
        <i class="bi bi-shield-check"></i>
        <span>
          <strong>Tecnico / ADM</strong>
          <small>Entregas, substituicoes e historico</small>
        </span>
      </button>

      <button class="profile-button" type="button" (click)="entrarComoFuncionario()">
        <i class="bi bi-person-check"></i>
        <span>
          <strong>Funcionario</strong>
          <small>Relatorio de estado do EPI</small>
        </span>
      </button>
    </div>
  </div>
</section>
