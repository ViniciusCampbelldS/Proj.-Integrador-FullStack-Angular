<section class="login-page">
  <div class="login-panel">
    <img src="/logo-mar.svg" alt="MAR Metalurgica" />

    <div class="login-copy">
      <p class="eyebrow">Sistema de gerenciamento</p>
      <h1>Seguranca do Trabalho</h1>
      <p>Escolha um perfil para acessar o prototipo.</p>
    </div>

    <div class="login-actions">
      <button class="profile-button primary" type="button" (click)="enterAsAdmin()">
        <i class="bi bi-shield-check"></i>
        <span>
          <strong>Tecnico / ADM</strong>
          <small>Entregas, substituicoes e historico</small>
        </span>
      </button>

      <button class="profile-button" type="button" (click)="enterAsEmployee()">
        <i class="bi bi-person-check"></i>
        <span>
          <strong>Funcionario</strong>
          <small>Relatorio de estado do EPI</small>
        </span>
      </button>
    </div>
  </div>
</section>
